name: Scheduled Fallback Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync Profile Data
        run: node scripts/sync-profile.js

      - name: Sync GitHub Fallback Data
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github-fallback.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "ylyamartchenko@gmail.com"
          git config --local user.name "YlyaBot"
          
          git add public/info/profile.json public/info/github-fallback.json
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: nightly scheduled sync of profile & github fallbacks" && git push)
